    { name = "aiosqlite" },
    { name = "alembic" },
    { name = "apscheduler" },
    { name = "asyncpg" },
    { name = "bcrypt" },
    { name = "crawlee", extra = ["beautifulsoup"] },
    { name = "fastapi" },
    { name = "gunicorn" },
    { name = "httpx", extra = ["socks"] },
    { name = "loguru" },
    { name = "phonenumbers" },
    { name = "psycopg2-binary" },
    { name = "pydantic", extra = ["email"] },
    { name = "pydantic-settings" },
    { name = "pyjwt" },
    { name = "python-dotenv" },
    { name = "python-multipart" },
    { name = "slowapi" },
    { name = "sqlalchemy", extra = ["asyncio"] },
    { name = "tldextract" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
